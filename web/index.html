      <h1>Solidify: engineering in 3D, with working labs, your own models and VR</h1>
      <p>Run real machines in 3D, cut them open and take them apart, with live engineering calculations. Describe a machine of your own and Solidify builds it. Open either in the browser or in a VR headset. Solidify needs JavaScript to run.</p>
      <h2>Systems</h2>
      <p>Engine, power train, PTO and driveline, hydraulics and three-point hitch, steering, tyres, tracks and traction, chassis and stability, implements, machine elements, mechanisms and machine dynamics, strength of materials, thermal plant, technical drawing, testing and management, vibration and the operator, and field operations. Coming soon: crop processing, water and irrigation, farm structures and precision farming.</p>
      <h2>For students and lecturers</h2>
      <p>Exam-style questions with fresh numbers, examiner-style marking with method marks, guided tours, classes and papers.</p>
