    <meta name="theme-color" content="#f5f6f2" />
    <script>
      document.documentElement.dataset.theme = 'light'
      try {
        var t = localStorage.getItem('solidify.theme')
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        else if (t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <div id="root"></div>
    <noscript>
      <h1>Solidify: interactive 3D tractor and farm machinery simulator</h1>
      <p>Cut open a running tractor in 3D and size every system with live engineering calculations. Solidify needs JavaScript to run.</p>
      <h2>Systems</h2>
      <p>Engine, power train, PTO and driveline, hydraulics and three-point hitch, steering, tyres, tracks and traction, chassis and stability, implements, machine elements, testing and management, vibration and the operator, and field operations. Coming soon: crop processing, water and irrigation, farm structures and precision farming.</p>
      <h2>For students and lecturers</h2>
      <p>Exam-style questions with fresh numbers, examiner-style marking with method marks, guided tours, classes and papers.</p>
