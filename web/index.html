    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050607" />
    <script>
      try {
        var t = localStorage.getItem('solidify.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta name="description" content="Solidify — interactive 3D cutaways of tractors and farm machinery: engines, transmissions, hydraulics, hitches and implements, with live engineering calculations." />
