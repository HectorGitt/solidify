# Every night: build the test set through the live API, score it, post the results to the admin page,
# and draft a few new library models for review. Needs the repository secret EVAL_TOKEN (the same value
# as the API's EVAL_TOKEN). Run it by hand from the Actions tab with "Run workflow".
name: Nightly model tests

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC, 03:00 in Lagos
  workflow_dispatch:
    inputs:
      limit:
        description: 'Build only the first n test cases (blank for all 30)'
        required: false
      drafts:
        description: 'New library models to draft (blank for the admin page setting)'
        required: false

jobs:
  evals:
    runs-on: ubuntu-latest
    # up to 100 drafts as well as the tests: about an hour and a half at three builds at a time
    timeout-minutes: 150
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run --config vitest.eval.config.ts
        env:
          EVAL_API: https://solidify-api-6b27sr35hq-ew.a.run.app
          EVAL_TOKEN: ${{ secrets.EVAL_TOKEN }}
          EVAL_LIMIT: ${{ inputs.limit }}
          EVAL_DRAFTS: ${{ inputs.drafts }}
          EVAL_LABEL: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
