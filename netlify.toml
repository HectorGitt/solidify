# The Solidify web app lives in web/ (the API in api/ deploys to Cloud Run separately).
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# The page shell and version file must never be cached, or an open tab keeps asking for page files from an
# old deploy (which are gone). Hashed files under /assets never change, so they can be cached for good.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
